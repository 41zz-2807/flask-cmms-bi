{% extends "admin/base.html" %}
{% block content %}
<style>
  .panel { background: #fff; border: 1px solid #e2e6ea; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(15,42,61,0.06); margin-bottom: 16px; }
  .panel h2 { font-size: 14px; font-weight: 700; color: #0f2a3d; margin-bottom: 6px; }
  .panel .who { font-size: 12.5px; color: #5b6472; margin-bottom: 14px; }
  .badge { border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
  .b-superadmin { background: #8e44ad; color: #fff; }
  .b-admin { background: #0c5c72; color: #fff; }
  .b-user { background: #eef1f4; color: #5b6472; }
  .cat-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
  .cat-item {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid #e2e6ea; border-radius: 8px; padding: 10px 12px;
    cursor: pointer; font-size: 12.5px; background: #fff;
  }
  .cat-item:hover { border-color: #9fc4d8; }
  .cat-item input { accent-color: #0c5c72; width: 15px; height: 15px; cursor: pointer; }
  .toolbar { margin: 14px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
  .toolbar a { color: #0c5c72; font-weight: 600; cursor: pointer; text-decoration: underline; }
  .btn { background: #1985a0; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #0c6d86; }
</style>

<div class="panel">
  <h2>Visibilitas Dashboard — {{ username }}</h2>
  <div class="who">
    Role: <span class="badge b-{{ role }}">{{ role }}</span>
    {% if role == 'superadmin' %}
      &middot; <em style="color:#8a94a3;">akses penuh + panel administrasi.</em>
    {% endif %}
  </div>

  <form method="post" action="{{ url_for('admin.user_access', username=username) }}">
    <div class="toolbar">
      <a id="btn-all">Pilih Semua</a> &middot;
      <a id="btn-none">Kosongkan</a>
    </div>
    <div style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px dashed #dfe5ea;">
      <label class="cat-item" style="border-color:#d8b8f0; background:#f8f1fc;">
        <input type="checkbox" name="categories" value="compare" {{ 'checked' if 'compare' in current }}>
        <span><strong>Perbandingan Dinamis</strong>
          <small style="color:#8a94a3;">(compare) &middot; bandingkan kinerja antar periode &amp; site</small></span>
      </label>
    </div>
    <div class="cat-list">
      {% for c in categories %}
      <label class="cat-item">
        <input type="checkbox" name="categories" value="{{ c.key }}"
               {{ 'checked' if c.key in current }}>
        <span>{{ c.title }} <small style="color:#8a94a3;">({{ c.key }})</small></span>
      </label>
      {% endfor %}
    </div>
    <div style="margin-top:16px;">
      <button class="btn" type="submit">Simpan Akses</button>
    </div>
  </form>
</div>

<script>
  document.getElementById("btn-all").addEventListener("click", () => {
    document.querySelectorAll('input[name="categories"]').forEach(cb => cb.checked = true);
  });
  document.getElementById("btn-none").addEventListener("click", () => {
    document.querySelectorAll('input[name="categories"]').forEach(cb => cb.checked = false);
  });
</script>
{% endblock %}
